[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-engine"
version = "0.1.0"
description = "A complete chess game in pure Python: engine, agent-friendly CLI, FastAPI HTTP API, web UI and a classic minimax AI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
chess = "chess.cli.main:main"

[tool.setuptools.packages.find]
include = ["chess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long-running tests (deep perft); deselect with -m \"not slow\"",
]
