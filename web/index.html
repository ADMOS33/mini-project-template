<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Échecs — moteur Python pur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="logo" href="/" aria-label="Échecs — accueil">
        <!-- Logo : cavalier dessiné en SVG inline -->
        <svg viewBox="0 0 45 45" aria-hidden="true">
          <path fill="#7fa650" d="M11 39c0-9 3.5-15.5 9-19l-2.5-5 5-3.5L25 15l7 1.5c3.5 1 6 4.5 6 8.5v14h-7v-9c0-2.5-1.5-4.5-3.5-5.5L23 30v9z"/>
          <circle cx="27.5" cy="19.5" r="1.6" fill="#161512"/>
        </svg>
        <span class="logo-name">Échecs</span>
      </a>
      <span class="spacer"></span>
      <button id="btn-sound" class="btn-icon" title="Activer / couper le son" aria-label="Son" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      </button>
      <button id="btn-new" class="btn">Nouvelle partie</button>
    </header>

    <div class="layout">
      <!-- Colonne gauche : cartes des joueurs -->
      <aside class="panel panel-left" aria-label="Joueurs">
        <div class="player-card" id="player-top">
          <span class="avatar" id="avatar-top" aria-hidden="true"></span>
          <span class="pinfo">
            <span class="pname" id="pname-top">Noirs</span>
            <span class="captured" id="captured-top"></span>
          </span>
          <span class="clock" id="clock-top"></span>
        </div>
        <div class="player-card" id="player-bottom">
          <span class="avatar" id="avatar-bottom" aria-hidden="true"></span>
          <span class="pinfo">
            <span class="pname" id="pname-bottom">Blancs</span>
            <span class="captured" id="captured-bottom"></span>
          </span>
          <span class="clock" id="clock-bottom"></span>
        </div>
        <div class="evalbar-wrap" title="Évaluation statique (centipions)">
          <div class="evalbar"><div id="evalbar-fill"></div></div>
          <span id="evalbar-label" class="muted">0.0</span>
        </div>
      </aside>

      <!-- Colonne centrale : plateau + statut -->
      <section class="board-col" id="board-col">
        <div class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="Échiquier"></div>
          <div id="promo-overlay" class="promo-overlay hidden" role="dialog" aria-label="Promotion"></div>
        </div>
        <div id="review-banner" class="review-banner hidden">Position passée — lecture seule</div>
        <div id="review-bar" class="review-bar hidden">
          <button class="btn-icon" data-review="first" title="Début (Début)" aria-label="Début">⏮</button>
          <button class="btn-icon" data-review="prev" title="Coup précédent (←)" aria-label="Précédent">◀</button>
          <span id="review-label"></span>
          <button class="btn-icon" data-review="next" title="Coup suivant (→)" aria-label="Suivant">▶</button>
          <button class="btn-icon" data-review="last" title="Position actuelle (Fin)" aria-label="Dernier">⏭</button>
          <button id="btn-exit-review" class="btn-secondary">▶ Jouer</button>
        </div>
        <div id="status" class="status" role="status">chargement…</div>
      </section>

      <!-- Colonne droite : actions + coups -->
      <aside class="panel panel-right" aria-label="Partie">
        <section class="block">
          <h2>Partie</h2>
          <div class="btn-row">
            <button id="btn-undo" class="btn-secondary">Annuler</button>
            <button id="btn-flip" class="btn-secondary" title="Retourner l'échiquier">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v3l4-4-4-4v3H5v6h2V4zm10 16H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
              Retourner
            </button>
          </div>
        </section>
        <section class="block">
          <h2>Adversaire</h2>
          <div class="segmented" role="tablist" aria-label="Adversaire">
            <button id="seg-human" class="seg" role="tab">Deux joueurs</button>
            <button id="seg-computer" class="seg" role="tab">Contre l'ordinateur</button>
          </div>
          <div id="vs-options" class="hidden">
            <select id="opt-color" aria-label="Votre couleur">
              <option value="w">Je joue les Blancs</option>
              <option value="b">Je joue les Noirs</option>
              <option value="random">Couleur aléatoire</option>
            </select>
            <select id="opt-depth" aria-label="Difficulté">
              <option value="1">Débutant (profondeur 1)</option>
              <option value="2">Facile (profondeur 2)</option>
              <option value="3" selected>Normal (profondeur 3)</option>
              <option value="4">Difficile (profondeur 4)</option>
            </select>
            <span id="thinking" class="thinking hidden">
              <span class="spinner" aria-hidden="true"></span> l'ordinateur réfléchit…
            </span>
          </div>
        </section>
        <section class="block grow">
          <h2>Coups</h2>
          <table class="moves-table">
            <thead>
              <tr><th class="num">n°</th><th>Blancs</th><th>Noirs</th></tr>
            </thead>
            <tbody id="moves-body">
              <tr class="empty-row"><td colspan="3">Aucun coup pour l'instant</td></tr>
            </tbody>
          </table>
        </section>
        <section class="block">
          <h2>Horloge</h2>
          <select id="opt-clock" aria-label="Horloge">
            <option value="none" selected>Sans horloge</option>
            <option value="300">5 min</option>
            <option value="600">10 min</option>
            <option value="182">3 min + 2 s</option>
          </select>
        </section>
        <details class="block io-block">
          <summary>FEN / PGN</summary>
          <textarea id="io-text" rows="4" placeholder="Colle une FEN ou un PGN ici…"></textarea>
          <div class="btn-row">
            <button id="btn-load-fen" class="btn-secondary">Charger la FEN</button>
            <button id="btn-load-pgn" class="btn-secondary">Charger le PGN</button>
          </div>
          <div class="btn-row">
            <button id="btn-copy-fen" class="btn-secondary">Copier la FEN</button>
            <button id="btn-copy-pgn" class="btn-secondary">Copier le PGN</button>
          </div>
        </details>
      </aside>
    </div>
  </main>

  <!-- Fenêtre de fin de partie -->
  <div id="gameover-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="gameover-title">
    <div class="modal-box">
      <h3 id="gameover-title">Fin de partie</h3>
      <p id="gameover-reason" class="muted"></p>
      <div class="btn-row">
        <button id="btn-gameover-new" class="btn">Rejouer</button>
        <button id="btn-gameover-review" class="btn-secondary">Revoir la partie</button>
      </div>
    </div>
  </div>

  <!-- Toasts (erreurs) -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="api.js"></script>
  <script src="board.js"></script>
</body>
</html>
